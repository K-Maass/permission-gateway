[project]
name = "paos-domain"
version = "0.1.0"
description = "Canonical PAOS domain model — the contract every provider attaches to"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paos_domain"]
